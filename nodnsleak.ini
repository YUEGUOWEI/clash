
[custom]

; ==================================================
; OpenClash 2026 - 独立策略组防干扰版
; Rule 模式 + Mihomo + Fake-IP
; 国内直连 / 国外代理 / 漏网手动选择
; ==================================================


; --------------------------------------------------
; 01. 广告过滤
; --------------------------------------------------

ruleset=REJECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
ruleset=REJECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list


; --------------------------------------------------
; 02. 局域网及特殊直连
; --------------------------------------------------

ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list


; --------------------------------------------------
; 03. Google 特殊规则
; --------------------------------------------------

; 特殊 Google 服务优先代理
ruleset=🚀 节点选择,[]DOMAIN-SUFFIX,xn--ngstr-lra8j.com
ruleset=🚀 节点选择,[]DOMAIN-SUFFIX,services.googleapis.cn
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/GoogleCNProxyIP.list

; 国内 Google 服务直连
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GoogleCN.list


; --------------------------------------------------
; 04. 国内域名直连
; --------------------------------------------------

ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaMedia.list
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list


; --------------------------------------------------
; 05. 已知国外域名代理
; --------------------------------------------------

ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyGFWlist.list


; --------------------------------------------------
; 06. 国内 IP 直连
; --------------------------------------------------

ruleset=DIRECT,[]GEOIP,LAN
ruleset=DIRECT,[]GEOIP,CN


; --------------------------------------------------
; 07. 国外 IP 自动代理
; 注意：不要添加 no-resolve
; Fake-IP 下需要允许 GEOIP 规则解析域名
; --------------------------------------------------

ruleset=🚀 节点选择,[]GEOIP,!CN


; --------------------------------------------------
; 08. 漏网流量独立兜底
; 不再引用主策略组，避免策略组联动
; --------------------------------------------------

ruleset=🐟 漏网之鱼,[]FINAL


; ==================================================
; 09. 主代理策略组
; ==================================================

custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🚀 手动选择`[]🇭🇰 香港节点`[]🇹🇼 台湾节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇰🇷 韩国节点`[]🇺🇸 美国节点`[]DIRECT


; --------------------------------------------------
; 10. 全部节点自动测速
; --------------------------------------------------

custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50


; --------------------------------------------------
; 11. 手动节点
; --------------------------------------------------

custom_proxy_group=🚀 手动选择`select`.*


; --------------------------------------------------
; 12. 漏网流量独立选择
; 选择 DIRECT 不影响主代理组
; 选择自动测速也不依赖主代理组
; --------------------------------------------------

custom_proxy_group=🐟 漏网之鱼`select`[]DIRECT`[]♻️ 自动选择`[]🚀 手动选择


; ==================================================
; 13. 六个国家自动测速组
; ==================================================

custom_proxy_group=🇭🇰 香港节点`url-test`(香港|港|HK|Hong Kong|HongKong)`http://www.gstatic.com/generate_204`300,,50

custom_proxy_group=🇹🇼 台湾节点`url-test`(台湾|台北|新北|彰化|TW|Taiwan)`http://www.gstatic.com/generate_204`300,,50

custom_proxy_group=🇯🇵 日本节点`url-test`(日本|东京|大阪|埼玉|JP|Japan)`http://www.gstatic.com/generate_204`300,,50

custom_proxy_group=🇸🇬 新加坡节点`url-test`(新加坡|狮城|SG|Singapore)`http://www.gstatic.com/generate_204`300,,50

custom_proxy_group=🇰🇷 韩国节点`url-test`(韩国|韓國|首尔|釜山|KR|KOR|Korea)`http://www.gstatic.com/generate_204`300,,50

custom_proxy_group=🇺🇸 美国节点`url-test`(美国|美國|洛杉矶|圣何塞|西雅图|纽约|达拉斯|US|USA|United States)`http://www.gstatic.com/generate_204`300,,50


; ==================================================
; 14. 规则生成
; ==================================================

enable_rule_generator=true
overwrite_original_rules=true
