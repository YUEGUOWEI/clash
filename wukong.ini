[custom]
; 优化版防 DNS 泄露极简配置

; 1. 强制走代理的特殊 Google / GFW 服务
ruleset=🚀 节点选择,[]DOMAIN-SUFFIX,google.com
ruleset=🚀 节点选择,[]DOMAIN-SUFFIX,services.googleapis.cn
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/GoogleCNProxyIP.list

; 2. 指定域名强制直连
ruleset=DIRECT,[]DOMAIN-SUFFIX,10010.cloudns.biz
ruleset=DIRECT,[]DOMAIN-SUFFIX,ygw.kdns.fr
ruleset=DIRECT,[]DOMAIN-SUFFIX,ygwwyzz666.eu.org
ruleset=DIRECT,[]DOMAIN-SUFFIX,guoweiyue.nyc.mn
ruleset=DIRECT,[]DOMAIN-SUFFIX,wy68.eu.org
ruleset=DIRECT,[]DOMAIN-SUFFIX,ygw645379106.eu.org

; 3. 广告拦截
ruleset=REJECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list

; 4. 基础直连规则（局域网、国内服务）
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Apple.list
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaMedia.list

; 5. IP 层直连与 DNS 解析优化（保留 no-resolve）
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list,no-resolve
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaIp.list,no-resolve
ruleset=DIRECT,[]GEOIP,CN,no-resolve
ruleset=🚀 节点选择,[]FINAL

; 6. 策略组
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]DIRECT`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`https://cp.cloudflare.com/generate_204`300,,50

enable_rule_generator=true
overwrite_original_rules=true
